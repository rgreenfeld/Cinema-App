name: Daily Cinema Scraper

on:
  schedule:
    # מריץ את הסקרייפר כל יום ב-06:00 בבוקר לפי שעון ישראל (04:00 UTC)
    - cron: '0 4 * * *'
  workflow_dispatch: # מאפשר להריץ את הסקרייפר גם ידנית בלחיצת כפתור ב-GitHub

# Prevent overlapping runs (e.g. a manual dispatch firing while the scheduled
# run is still in progress). Concurrent runs race on the delete-then-insert
# steps in uploadToSupabase.js/planet.js, which is a direct cause of
# duplicated rows in the DB.
concurrency:
  group: daily-cinema-scraper
  cancel-in-progress: false

jobs:
  scrape-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Prune outdated screenings
        id: prune
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node scrapers/pruneOldScreenings.js

      - name: Run scraper + upload pipeline
        id: cinema-city
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # Optional: prefer a service_role key (bypasses RLS) so the cleanup
          # delete of outdated screenings always works. Add this secret in
          # GitHub → Settings → Secrets and variables → Actions.
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node scrapers/cinemaCity.js
          node scrapers/uploadToSupabase.js
      - name: Run Planet Scraper
        id: planet
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node scrapers/planet.js

      - name: Run Hot Cinema scraper + upload
        id: hot-cinema
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_INPUT_FILE: output.hot.json
        run: |
          node scrapers/hotCinema.js
          node scrapers/uploadToSupabase.js

      - name: Run Lev Cinema scraper + upload
        id: lev
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_INPUT_FILE: output.lev.json
        run: |
          node scrapers/lev.js
          node scrapers/uploadToSupabase.js

      - name: Run Movieland scraper + upload
        id: movieland
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_INPUT_FILE: output.movieland.json
        run: |
          node scrapers/movieland.js
          node scrapers/uploadToSupabase.js

      - name: Fail the job if any stage failed
        if: always()
        run: |
          failed=0
          for outcome in \
            "prune:${{ steps.prune.outcome }}" \
            "cinema-city:${{ steps.cinema-city.outcome }}" \
            "planet:${{ steps.planet.outcome }}" \
            "hot-cinema:${{ steps.hot-cinema.outcome }}" \
            "lev:${{ steps.lev.outcome }}" \
            "movieland:${{ steps.movieland.outcome }}"; do
            name="${outcome%%:*}"
            status="${outcome##*:}"
            echo "$name: $status"
            if [ "$status" = "failure" ]; then
              failed=1
            fi
          done
          if [ "$failed" = "1" ]; then
            echo "❌ One or more scraper stages failed — see logs above for details."
            exit 1
          fi


