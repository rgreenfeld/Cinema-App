name: Daily Cinema Scraper

on:
  schedule:
    # מריץ את הסקרייפר כל יום ב-06:00 בבוקר לפי שעון ישראל (04:00 UTC)
    - cron: '0 4 * * *'
  workflow_dispatch: # מאפשר להריץ את הסקרייפר גם ידנית בלחיצת כפתור ב-GitHub

jobs:
  scrape-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Prune outdated screenings
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node scrapers/pruneOldScreenings.js

      - name: Run scraper + upload pipeline
        id: cinema-city
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # Optional: prefer a service_role key (bypasses RLS) so the cleanup
          # delete of outdated screenings always works. Add this secret in
          # GitHub → Settings → Secrets and variables → Actions.
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node scrapers/cinemaCity.js
          node scrapers/uploadToSupabase.js
      - name: Run Planet Scraper
        id: planet
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node scrapers/planet.js

      - name: Run Hot Cinema scraper + upload
        id: hot-cinema
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_INPUT_FILE: output.hot.json
        run: |
          node scrapers/hotCinema.js
          node scrapers/uploadToSupabase.js

      - name: Run Movieland scraper + upload
        id: movieland
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_INPUT_FILE: output.movieland.json
        run: |
          node scrapers/movieland.js
          node scrapers/uploadToSupabase.js

      - name: Run Lev Cinema scraper + upload
        id: lev
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_INPUT_FILE: output.lev.json
        run: |
          node scrapers/lev.js
          node scrapers/uploadToSupabase.js

      - name: Fail job if any chain scraper failed
        if: |
          steps.cinema-city.outcome == 'failure' ||
          steps.planet.outcome == 'failure' ||
          steps.hot-cinema.outcome == 'failure' ||
          steps.movieland.outcome == 'failure' ||
          steps.lev.outcome == 'failure'
        run: |
          echo "One or more chain scrapers failed (see step outcomes above); marking job as failed."
          exit 1
